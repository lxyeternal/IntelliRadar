<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malicious Package Intelligence Details</title>
    <link rel="stylesheet" href="css/detail.css">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.5.95/css/materialdesignicons.min.css" rel="stylesheet">
</head>
<body>
    <!-- 添加顶部导航栏 -->
    <nav class="top-nav">
        <div class="nav-content">
            <a href="index.html" class="nav-back">
                <span class="mdi mdi-arrow-left"></span>
                <span>Back to Dashboard</span>
            </a>
            <div class="nav-title">
                <span class="mdi mdi-database-search"></span>
                Malicious Package Details
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 左侧筛选栏 -->
        <aside class="sidebar">
            <h3>Package Registry</h3>
            <div class="filter-list" id="packageManagerFilters">
                <!-- 这里将由JavaScript动态填充 -->
            </div>
        </aside>

        <!-- 主要内容区 -->
        <main class="main-content">
            <!-- 搜索框 -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search package name...">
                <button id="searchButton">
                    <span class="mdi mdi-magnify"></span>
                </button>
            </div>

            <!-- 结果展示区 -->
            <div class="results-container" id="resultsContainer">
                <!-- 这里将由JavaScript动态填充 -->
            </div>

            <!-- 分页控制 -->
            <div class="pagination">
                <button id="prevPage" class="page-btn">
                    <span class="mdi mdi-chevron-left"></span>
                </button>
                <span id="currentPage">Page 1</span>
                <button id="nextPage" class="page-btn">
                    <span class="mdi mdi-chevron-right"></span>
                </button>
            </div>
        </main>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <span class="mdi mdi-package-variant"></span>
                    <h2>Package Intelligence</h2>
                </div>
                <button class="close-button" onclick="closeModal()">
                    <span class="mdi mdi-close"></span>
                </button>
            </div>
            <div class="modal-body" id="detailContent">
                <!-- 这里将由JavaScript动态填充 -->
            </div>
        </div>
    </div>
    <script src="js/detail.js"></script>
</body>
</html>
