version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: intelliradar-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: intelliradar2024
      MONGO_INITDB_DATABASE: intelliradar
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./backend/database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - intelliradar-network
    command: mongod --auth
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Express (Web UI for MongoDB)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: intelliradar-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: intelliradar2024
      ME_CONFIG_MONGODB_URL: mongodb://admin:intelliradar2024@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: intelliradar2024
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - intelliradar-network

  # IntelliRadar Backend Crawler
  intelliradar-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliradar-backend
    restart: unless-stopped
    environment:
      # MongoDB Configuration
      MONGODB_URI: mongodb://admin:intelliradar2024@mongodb:27017/intelliradar?authSource=admin
      
      # Chrome Configuration
      CHROME_BIN: /usr/bin/google-chrome
      CHROMEDRIVER_PATH: /usr/local/bin/chromedriver
      
      # Application Configuration
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
      
      # Crawler Configuration
      REQUEST_DELAY: 2
      TIMEOUT: 30
      MAX_WORKERS: 3
      
      # LLM Configuration (if needed)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
    volumes:
      - /dev/shm:/dev/shm  # Shared memory for Chrome
      - crawler_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - intelliradar-network
    # Run crawler every hour using cron-like schedule
    # command: ["python", "main.py", "--workers", "3"]
    # For continuous running, use:
    command: ["python", "-c", "
      import time;
      from crawler.pipeline import CrawlerPipeline;
      pipeline = CrawlerPipeline();
      while True:
        try:
          print('🚀 Starting crawler pipeline...');
          results = pipeline.run_all(max_workers=3, enable_content_processing=True);
          print('✅ Pipeline completed, sleeping for 1 hour...');
          time.sleep(3600);
        except Exception as e:
          print(f'❌ Pipeline error: {e}');
          time.sleep(300);
      "]
    healthcheck:
      test: ["CMD", "python", "-c", "from database import MongoDBStorageManager; print('Backend OK')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Optional: Redis for caching (future enhancement)
  redis:
    image: redis:7.2-alpine
    container_name: intelliradar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - intelliradar-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx reverse proxy (future enhancement)
  nginx:
    image: nginx:1.25-alpine
    container_name: intelliradar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - mongo-express
    networks:
      - intelliradar-network
    profiles:
      - production  # Only start with --profile production

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  crawler_logs:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  intelliradar-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
