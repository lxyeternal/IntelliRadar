services:
  # MongoDB database service
  mongodb:
    image: mongo:7.0
    container_name: ChainGuard-Database
    ports:
      - "27017:27017"
    volumes:
      # Persistent MongoDB data
      - mongodb_data:/data/db
      - mongodb_logs:/var/log/mongodb
      # Database initialization
      - ./Intelliradar/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./Intelliradar/database/intelliradar:/backup/database/intelliradar:ro
    environment:
      - MONGO_INITDB_DATABASE=intelliradar
    networks:
      - chainguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Database initialization service
  db-init:
    image: mongo:7.0
    container_name: ChainGuard-Database-Init
    volumes:
      - ./Intelliradar/init-db.sh:/init-db.sh:ro
      - ./Intelliradar/database/intelliradar:/backup/database/intelliradar:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - chainguard-network
    command: ["bash", "/init-db.sh"]
    restart: "no"  # 只运行一次
    environment:
      - MONGO_HOST=mongodb

  # Intelliradar service (FastAPI)
  intelliradar:
    build:
      context: ./Intelliradar
      dockerfile: Dockerfile
    container_name: ChainGuard-Intelliradar
    ports:
      - "20001:8000"
    volumes:
      # 日志文件挂载到宿主机
      - ./logs:/app/logs
      # 下载的包文件挂载到宿主机（持久化存储）
      - ./Intelliradar/packages:/app/packages
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=intelliradar
      - USER_DATABASE_NAME=intelliradar
      - SECRET_KEY=your-super-secret-key-change-this-in-production-2024
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - chainguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/api
    container_name: ChainGuard-Frontend
    ports:
      - "443:80"
    depends_on:
      - intelliradar
    networks:
      - chainguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  chainguard-network:
    driver: bridge
    name: chainguard-network

volumes:
  mongodb_data:
    name: chainguard-mongodb-data
  mongodb_logs:
    name: chainguard-mongodb-logs
